name: provas-dcer-production

services:
  app:
    build: .
    image: provas-dcer-app:production
    restart: unless-stopped
    env_file: .env.production
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-provas_dcer}:${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-provas_dcer}?schema=public
      ADMIN_SESSION_SECRET: ${ADMIN_SESSION_SECRET:?Defina ADMIN_SESSION_SECRET}
      ADMIN_MFA_ENCRYPTION_KEY: ${ADMIN_MFA_ENCRYPTION_KEY:?Defina ADMIN_MFA_ENCRYPTION_KEY}
      APP_URL: ${APP_URL:?Defina APP_URL}
      PORT: "3001"
      NEXT_TELEMETRY_DISABLED: "1"
      SYSTEM_BACKUP_DIR: /app/system-backups
      SYSTEM_RESTORE_DIR: /app/system-backups/restores
      SYSTEM_APP_ROOT: /app
    ports:
      - "127.0.0.1:${APP_PORT:-3001}:3001"
    volumes:
      - system_backups:/app/system-backups
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-provas_dcer}
      POSTGRES_USER: ${POSTGRES_USER:-provas_dcer}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  postgres_data:
  system_backups:
